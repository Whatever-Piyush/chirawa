name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER:     chirawa
          POSTGRES_PASSWORD: chirawa_test_password
          POSTGRES_DB:       chirawa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck — API
        run: pnpm --filter @chirawa/api typecheck

      - name: Typecheck — Types package
        run: pnpm --filter @chirawa/types typecheck

      - name: Run unit tests
        run: pnpm --filter @chirawa/api test
        env:
          NODE_ENV:     test
          DATABASE_URL: postgresql://chirawa:chirawa_test_password@localhost:5432/chirawa_test
          REDIS_URL:    redis://localhost:6379
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY_TEST }}
          JWT_PUBLIC_KEY:  ${{ secrets.JWT_PUBLIC_KEY_TEST }}

      - name: Build Docker image (verify it builds)
        run: docker build -t chirawa-api:test .
