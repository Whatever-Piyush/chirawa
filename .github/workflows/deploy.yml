name: Deploy to Hetzner

# Full flow documented in docs/DEPLOYMENT.md. Shape (audit P0-3 + P0-6):
#   push to main → CI (tests + typecheck + image build) → SSH release of the
#   EXACT tested SHA via scripts/server-release.sh → public health gate.
# A red CI blocks the deploy: the deploy job `needs` the called CI workflow.

on:
  push:
    branches: [main]

# Only one production mutation at a time — shared with rollback.yml so a
# deploy and a rollback can never interleave.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Release exact tested commit on server
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: appuser
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/chirawa
            echo "🚀 Deploying ${{ github.sha }}"
            git fetch origin
            git checkout --detach ${{ github.sha }}
            bash scripts/server-release.sh

      - name: Verify public health endpoint
        run: |
          STATUS=""
          for i in $(seq 1 10); do
            sleep 5
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://api.chirawa.in/health || true)
            echo "attempt $i → $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Deploy healthy: ${{ github.sha }}"
              exit 0
            fi
          done
          echo "❌ Public health check FAILED (last status: $STATUS)"
          echo "Roll back now: Actions → 'Rollback production' → Run workflow (or scripts/rollback.sh). See docs/ROLLBACK_DRILL.md."
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deploy failed for commit ${{ github.sha }} — see docs/ROLLBACK_DRILL.md for the rollback runbook"
          # Add WhatsApp/Slack notification here
