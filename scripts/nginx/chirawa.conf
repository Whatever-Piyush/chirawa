# Chirawa API — Nginx reverse proxy config
# Place at: /etc/nginx/sites-available/chirawa
# Symlink: ln -s /etc/nginx/sites-available/chirawa /etc/nginx/sites-enabled/

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=60r/m;

upstream chirawa_api {
  # PM2 cluster — 4 workers all on same port
  server 127.0.0.1:3000;
  keepalive 64;
}

server {
  listen 80;
  server_name api.chirawa.in;

  # Redirect HTTP → HTTPS
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.chirawa.in;

  # SSL — managed by Certbot
  ssl_certificate     /etc/letsencrypt/live/api.chirawa.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.chirawa.in/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  # Security headers
  add_header X-Frame-Options        "DENY"            always;
  add_header X-Content-Type-Options "nosniff"         always;
  add_header X-XSS-Protection       "1; mode=block"   always;
  add_header Referrer-Policy        "no-referrer"     always;

  # Gzip compression
  gzip on;
  gzip_types application/json text/plain;
  gzip_min_length 1000;

  # Health check — higher rate limit for UptimeRobot
  location = /health {
    proxy_pass http://chirawa_api;
    limit_req  zone=api burst=20 nodelay;
  }

  # Auth endpoints — stricter rate limiting
  location /api/v1/auth/ {
    proxy_pass http://chirawa_api;
    limit_req  zone=auth burst=10 nodelay;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Razorpay webhooks — no rate limit (they're pre-verified)
  location /api/v1/payments/webhook/ {
    proxy_pass       http://chirawa_api;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Raw body needed for HMAC verification
    proxy_request_buffering off;
  }

  # Socket.io — WebSocket upgrade
  location /socket.io/ {
    proxy_pass         http://chirawa_api;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_set_header   X-Real-IP  $remote_addr;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400s;
  }

  # All other API routes
  location / {
    proxy_pass http://chirawa_api;
    limit_req  zone=api burst=50 nodelay;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
  }
}
